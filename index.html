<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <title>T&M music label</title>
</head>
<body class="dark-theme">
    <main class="page">
        <section class="header">
            <nav class="navbar">
                <div class="burger-menu" id="burgerMenu">
                    <span class="line"></span>
                    <span class="line"></span>
                    <span class="line"></span>
                </div>
                
                <ul class="nav-links" id="navLinks">
                    <li><a class="nav-links-item" href="#">Главная</a></li>
                    <li><a class="nav-links-item" href="#">Услуги</a></li>

            </nav>
            <div class="header-logo-container">
                <a class="header_logo" href="#">
                    <img class="header-logo-image" src="./images/logo.png" alt="logo">
                </a>
            </div>
            <ul class="header__list">
                <li class="header__list-item">
                    <a class="header__list-item-link" href="#">
                        <img class="header__list-item-logo" src="./images/tg-logo.png" alt="logo telegram">
                    </a>
                </li>
                <li class="header__list-item">
                    <a class="header__list-item-link" href="#">
                        <img class="header__list-item-logo" src="./images/inst-logo.png" alt="logo youtube">
                    </a>
                </li>
                <li class="header__list-item">
                    <a class="header__list-item-link" href="#">
                        <img class="header__list-item-logo" src="./images/vk-logo.png" alt="logo vkontakt">
